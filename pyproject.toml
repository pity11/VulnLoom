[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnloom"
version = "0.10.0"
description = "Evidence-first agent framework for authorized vulnerability research"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "VulnLoom contributors" }]
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
vulnloom = "vulnloom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "docker_integration: optional integration test requiring a local Docker engine",
    "semgrep_integration: optional integration test requiring a local Semgrep binary",
    "socket_integration: optional integration test using a local loopback socket",
    "composition_integration: optional full local Docker, live Broker, and verdict probe",
]

[tool.coverage.run]
branch = true
source = ["vulnloom"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
