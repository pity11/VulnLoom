name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Verify generated schemas
        run: |
          python scripts/export_schemas.py
          git diff --exit-code -- schemas
      - name: Verify benchmark fixtures
        run: |
          python scripts/export_benchmark_fixtures.py
          python scripts/export_analyzer_evaluation_fixtures.py
          python scripts/export_agent_workflow_regression_fixtures.py
          git diff --exit-code -- benchmarks
      - name: M6.1 offline regression gate
        run: python scripts/run_m6_1_regression_gate.py
      - name: M6.3 offline analyzer regression gate
        run: python scripts/run_m6_3_regression_gate.py
      - name: M9.2 offline Agent workflow mutation gate
        run: python scripts/run_m9_2_agent_workflow_regression_gate.py
      - name: Test
        run: pytest --cov=vulnloom --cov-report=term-missing
