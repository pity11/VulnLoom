name: Phase 3 Admission

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rootless-isolation:
    name: Rootless Linux isolation and Broker boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install rootless Docker prerequisites
        run: |
          sudo systemctl disable --now docker.service docker.socket
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          architecture="$(dpkg --print-architecture)"
          sudo tee /etc/apt/sources.list.d/docker.sources > /dev/null <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: noble
          Components: stable
          Architectures: ${architecture}
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          sudo apt-get update
          docker_version="5:29.7.2-1~ubuntu.24.04~noble"
          sudo apt-get install --yes \
            dbus-user-session \
            docker-ce="${docker_version}" \
            docker-ce-cli="${docker_version}" \
            docker-ce-rootless-extras="${docker_version}" \
            uidmap
          sudo systemctl disable --now docker.service docker.socket
          if ! grep -q "^${USER}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$USER"
          fi
          if ! grep -q "^${USER}:" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$USER"
          fi
      - name: Start rootless Docker as a delegated user service
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          test -S "/run/user/${uid}/bus"
          export XDG_RUNTIME_DIR="/run/user/${uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          dockerd-rootless-setuptool.sh install --force
          systemctl --user is-active docker.service
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix://${XDG_RUNTIME_DIR}/docker.sock" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Provision versioned admission images
        run: |
          docker pull alpine:3.22
          docker pull ubuntu:24.04
          docker pull bridgecrew/checkov:3.3.15
          docker pull kubesec/kubesec:v2.14.2
          docker pull aquasec/trivy:0.73.0
          docker build --pull=false \
            --file tests/fixtures/codeql-admission/Dockerfile \
            --tag vulnloom/codeql-admission:2.26.2 \
            .
          codeql_image_id="$(docker image inspect --format '{{.Id}}' \
            vulnloom/codeql-admission:2.26.2)"
          echo "VULNLOOM_CODEQL_IMAGE=${codeql_image_id}" >> "$GITHUB_ENV"
      - name: Provision sealed Trivy database outside execution
        run: |
          cache_root="${RUNNER_TEMP}/trivy-provisioning-cache"
          sealed_root="${RUNNER_TEMP}/trivy-sealed-database"
          mkdir -p "${cache_root}" "${sealed_root}/db"
          docker run --rm --pull never \
            --mount "type=bind,src=${cache_root},dst=/cache" \
            --entrypoint /usr/local/bin/trivy \
            aquasec/trivy:0.73.0 \
            filesystem --cache-dir /cache --download-db-only --no-progress
          cp "${cache_root}/db/metadata.json" "${sealed_root}/db/metadata.json"
          cp "${cache_root}/db/trivy.db" "${sealed_root}/db/trivy.db"
          chmod -R a-w "${sealed_root}"
          echo "VULNLOOM_TRIVY_DATABASE=${sealed_root}" >> "$GITHUB_ENV"
      - name: Run production admission probes
        env:
          VULNLOOM_DOCKER_INTEGRATION: "1"
          VULNLOOM_COMPOSITION_INTEGRATION: "1"
          VULNLOOM_ROOTLESS_QUALIFICATION: "1"
          VULNLOOM_ANALYZER_INTEGRATION: "1"
        run: |
          docker info
          pytest \
            tests/test_runner_docker_integration.py \
            tests/test_validation_composition_integration.py
          pytest -m docker_integration tests/test_analyzer_docker_execution.py
