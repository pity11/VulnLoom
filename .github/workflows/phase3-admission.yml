name: Phase 3 Admission

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rootless-isolation:
    name: Rootless Linux isolation and Broker boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up pinned rootless Docker Engine
        uses: docker/setup-docker-action@v5
        with:
          version: v29.7.2
          rootless: true
          set-host: true
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Prepare immutable test image
        run: docker pull alpine:3.22
      - name: Run production admission probes
        env:
          VULNLOOM_DOCKER_INTEGRATION: "1"
          VULNLOOM_COMPOSITION_INTEGRATION: "1"
          VULNLOOM_ROOTLESS_QUALIFICATION: "1"
        run: |
          docker info
          pytest \
            tests/test_runner_docker_integration.py \
            tests/test_validation_composition_integration.py
